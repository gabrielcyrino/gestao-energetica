# Ambiente completo: TimescaleDB + API + front-end.
# Portas do host fora do padrão para não colidir com outros serviços da máquina.
#   web  → http://localhost:6470     api → http://localhost:6472/docs     db → localhost:6473
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: energia
      POSTGRES_PASSWORD: energia
      POSTGRES_DB: energia
    ports:
      - '6473:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U energia -d energia']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      EE_DATABASE_URL: postgresql+psycopg://energia:energia@db:5432/energia
      EE_ENVIRONMENT: demo
      EE_JWT_SECRET: troque-este-segredo-em-producao
      EE_CORS_ORIGINS: '["http://localhost:6470","http://localhost:6471"]'
      EE_SEED_ON_START: '1' # carrega a base DEMO na primeira subida
    ports:
      - '6472:6472'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:6472
    ports:
      - '6470:80'
    depends_on:
      - api

volumes:
  db-data:
